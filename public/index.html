<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Akadera to Spotify</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p class="subtitle">Export Radio Akadera playlist to Spotify</p>

      <div class="time-range">
        <input type="time" id="timeFrom" />
        <span>—</span>
        <input type="time" id="timeTo" />
        <button id="fetchBtn">Fetch</button>
      </div>

      <button id="downloadBtn" hidden>Download Playlist</button>

      <div id="status" class="status" hidden></div>

      <section id="songList" class="song-list" hidden>
        <h2>Songs Found</h2>
        <ul id="songs"></ul>
      </section>

      <footer>
        <p>
          Upload the downloaded file to
          <a
            href="https://www.tunemymusic.com/transfer/text-file-to-spotify"
            target="_blank"
            rel="noopener"
            >TuneMyMusic</a
          >
          to create your Spotify playlist.
        </p>
        <p>
          <a
            href="https://github.com/alex-pokolenko/replay-akadera"
            target="_blank"
            rel="noopener"
            ><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: text-bottom"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg> GitHub</a
          >
        </p>
      </footer>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
